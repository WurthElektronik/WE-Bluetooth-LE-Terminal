<ion-app>
  @switch (state) {
    @case ('Valid') {
      <ion-router-outlet></ion-router-outlet>
    }
    @case ('NotSupported') {
      <ion-label class="notsupported">{{ 'notsupported' | translate }}</ion-label>
    }
    @case ('BluetoothNotEnabled') {
      <ion-label class="notsupported">{{ 'bluetoothoff' | translate }}</ion-label>
    }
    @case ('BluetoothNoPermissions') {
      <ion-label class="notsupported">{{ 'bluetoothnoperm' | translate }}</ion-label>
    }
  }
</ion-app>
